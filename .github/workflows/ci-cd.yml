name: Churn CI and CD
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      SPARK_MASTER: local[2]
      SPARK_DRIVER_MEMORY: 1g
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-native.lock
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned application and separate Airflow environments
        run: |
          python -m venv "$RUNNER_TEMP/churn-app"
          "$RUNNER_TEMP/churn-app/bin/python" -m pip install -r requirements-native.lock
          "$RUNNER_TEMP/churn-app/bin/python" -m pip install pytest==8.3.5 -c requirements-native.lock
          "$RUNNER_TEMP/churn-app/bin/python" -m pip check
          python -m venv "$RUNNER_TEMP/churn-airflow"
          "$RUNNER_TEMP/churn-airflow/bin/python" -m pip install 'apache-airflow[postgres]==2.10.5' \
            --constraint https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.11.txt
          "$RUNNER_TEMP/churn-airflow/bin/python" -m pip check
          echo "CHURN_PYTHON=$RUNNER_TEMP/churn-app/bin/python" >> "$GITHUB_ENV"
      - name: Validate code and deployment safeguards
        run: |
          "$CHURN_PYTHON" -m compileall -q churn dags scripts
          bash -n scripts/run_scoring.sh scripts/ci_native.sh
          "$CHURN_PYTHON" scripts/check_ci_contract.py
          "$CHURN_PYTHON" -m pytest -q tests
      - name: Parse the six-task DAG with native Airflow
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
        run: |
          export AIRFLOW_HOME="$RUNNER_TEMP/airflow-check"
          "$RUNNER_TEMP/churn-airflow/bin/airflow" db migrate
          "$RUNNER_TEMP/churn-airflow/bin/python" -c "from airflow.models import DagBag; b=DagBag('dags', include_examples=False); assert not b.import_errors, b.import_errors; assert set(b.dags['credit_card_churn_poc'].task_ids) == {'resolve_model','export_existing','data_quality','prepare','features','score'}"
      - name: Native PySpark and champion-reuse smoke test
        run: bash scripts/ci_native.sh
      - name: Package verified source
        run: |
          "$CHURN_PYTHON" scripts/build_native_release.py --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/native-release/release.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: tested-native-release
          path: ${{ runner.temp }}/native-release/
          retention-days: 7
          compression-level: 0

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: poc-aws
    concurrency:
      group: churn-poc-aws-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Reject superseded main release
        run: |
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$current" = "$GITHUB_SHA" || { echo 'Superseded commit; deploy current main.'; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: tested-native-release
          path: ${{ runner.temp }}/native-release
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload verified source and deploy through SSM
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/native-release"
          digest=$(cat release.tar.gz.sha256)
          printf '%s  %s\n' "$digest" release.tar.gz | sha256sum -c -
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          aws s3 cp release.tar.gz "s3://${DEPLOY_BUCKET}/churn-poc/deployments/${release_id}/release.tar.gz"
          python -m pip install boto3==1.37.38
          python "$GITHUB_WORKSPACE/scripts/deploy_native_ssm.py" --release "$release_id" --sha256 "$digest"
